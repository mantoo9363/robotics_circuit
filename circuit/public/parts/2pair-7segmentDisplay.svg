<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 100" width="200" height="100">
  <defs>
    <linearGradient id="pcbGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2a2a2a" />
      <stop offset="100%" stop-color="#181818" />
    </linearGradient>
    <linearGradient id="bezelGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#141414" />
      <stop offset="100%" stop-color="#222222" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- PCB Base -->
  <rect x="2" y="2" width="196" height="96" rx="6" fill="url(#pcbGrad)" stroke="#3f3f46" stroke-width="1.5" />

  <!-- Mounting Holes -->
  <circle cx="10" cy="10" r="3" fill="#09090b" stroke="#52525b" stroke-width="1" />
  <circle cx="190" cy="10" r="3" fill="#09090b" stroke="#52525b" stroke-width="1" />
  <circle cx="10" cy="90" r="3" fill="#09090b" stroke="#52525b" stroke-width="1" />
  <circle cx="190" cy="90" r="3" fill="#09090b" stroke="#52525b" stroke-width="1" />

  <!-- Display Bezel -->
  <rect x="18" y="16" width="164" height="68" rx="4" fill="url(#bezelGrad)" stroke="#09090b" stroke-width="1.5" />

  <!-- 4 Digits (8 8 : 8 8) -->
  <!-- Digit 1 -->
  <g transform="translate(26, 24)" fill="#ef4444" filter="url(#glow)">
    <!-- A -->
    <polygon points="3,1 5,3 23,3 25,1 23,-1 5,-1" />
    <!-- B -->
    <polygon points="26,3 28,5 28,23 26,25 24,23 24,5" />
    <!-- C -->
    <polygon points="26,27 28,29 28,47 26,49 24,47 24,29" />
    <!-- D -->
    <polygon points="3,51 5,53 23,53 25,51 23,49 5,49" />
    <!-- E -->
    <polygon points="2,27 4,29 4,47 2,49 0,47 0,29" />
    <!-- F -->
    <polygon points="2,3 4,5 4,23 2,25 0,23 0,5" />
    <!-- G -->
    <polygon points="3,26 5,28 23,28 25,26 23,24 5,24" />
    <!-- DP -->
    <circle cx="30" cy="51" r="2" />
  </g>

  <!-- Digit 2 -->
  <g transform="translate(62, 24)" fill="#ef4444" filter="url(#glow)">
    <polygon points="3,1 5,3 23,3 25,1 23,-1 5,-1" />
    <polygon points="26,3 28,5 28,23 26,25 24,23 24,5" />
    <polygon points="26,27 28,29 28,47 26,49 24,47 24,29" />
    <polygon points="3,51 5,53 23,53 25,51 23,49 5,49" />
    <polygon points="2,27 4,29 4,47 2,49 0,47 0,29" />
    <polygon points="2,3 4,5 4,23 2,25 0,23 0,5" />
    <polygon points="3,26 5,28 23,28 25,26 23,24 5,24" />
    <circle cx="30" cy="51" r="2" />
  </g>

  <!-- Center Colon Dots -->
  <circle cx="100" cy="40" r="2.5" fill="#ef4444" filter="url(#glow)" />
  <circle cx="100" cy="60" r="2.5" fill="#ef4444" filter="url(#glow)" />

  <!-- Digit 3 -->
  <g transform="translate(108, 24)" fill="#ef4444" filter="url(#glow)">
    <polygon points="3,1 5,3 23,3 25,1 23,-1 5,-1" />
    <polygon points="26,3 28,5 28,23 26,25 24,23 24,5" />
    <polygon points="26,27 28,29 28,47 26,49 24,47 24,29" />
    <polygon points="3,51 5,53 23,53 25,51 23,49 5,49" />
    <polygon points="2,27 4,29 4,47 2,49 0,47 0,29" />
    <polygon points="2,3 4,5 4,23 2,25 0,23 0,5" />
    <polygon points="3,26 5,28 23,28 25,26 23,24 5,24" />
    <circle cx="30" cy="51" r="2" />
  </g>

  <!-- Digit 4 -->
  <g transform="translate(144, 24)" fill="#ef4444" filter="url(#glow)">
    <polygon points="3,1 5,3 23,3 25,1 23,-1 5,-1" />
    <polygon points="26,3 28,5 28,23 26,25 24,23 24,5" />
    <polygon points="26,27 28,29 28,47 26,49 24,47 24,29" />
    <polygon points="3,51 5,53 23,53 25,51 23,49 5,49" />
    <polygon points="2,27 4,29 4,47 2,49 0,47 0,29" />
    <polygon points="2,3 4,5 4,23 2,25 0,23 0,5" />
    <polygon points="3,26 5,28 23,28 25,26 23,24 5,24" />
    <circle cx="30" cy="51" r="2" />
  </g>
</svg>
