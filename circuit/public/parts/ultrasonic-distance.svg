<desc style="fill:rgb(0, 0, 0);stroke:none;color:rgb(11, 11, 11);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">Illustration of an HC-SR04 ultrasonic sensor: a navy blue rectangular board with four corner mounting holes, labeled HC-SR04 in white at the top, two circular ultrasonic transducers with concentric gray and olive rings, a small gray oval resonator between them, four vertical pin labels reading VCC, TRIG, ECHO, GND, and four gray pin legs extending down from the board.</desc>
