<svg width="120" height="220" viewBox="0 0 120 220" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Board body -->
  <rect x="14" y="4" width="92" height="212" rx="5" fill="#1A1A2E" stroke="#0F3460" stroke-width="2"/>
  <!-- Left pin rail -->
  <rect x="9" y="12" width="8" height="196" rx="1.5" fill="#2B2F31"/>
  <!-- Right pin rail -->
  <rect x="103" y="12" width="8" height="196" rx="1.5" fill="#2B2F31"/>
  <!-- USB connector -->
  <rect x="43" y="0" width="34" height="12" rx="2" fill="#C0C0C0" stroke="#8B9299"/>
  <rect x="48" y="2" width="24" height="6" rx="1" fill="#6B7280"/>
  <!-- ESP32 main chip -->
  <rect x="35" y="65" width="50" height="50" rx="4" fill="#2F3336" stroke="#51575D"/>
  <rect x="38" y="68" width="44" height="44" rx="3" fill="#1A1A1A"/>
  <text x="60" y="89" text-anchor="middle" font-family="Arial, sans-serif" font-size="7" font-weight="700" fill="#4FC3F7">ESP32</text>
  <text x="60" y="100" text-anchor="middle" font-family="Arial, sans-serif" font-size="5" fill="#B0BEC5">WROOM-32</text>
  <text x="60" y="110" text-anchor="middle" font-family="Arial, sans-serif" font-size="4.5" fill="#78909C">Xtensa LX6</text>
  <!-- Flash chip -->
  <rect x="40" y="130" width="40" height="18" rx="2" fill="#262A2D" stroke="#4B5258"/>
  <text x="60" y="141" text-anchor="middle" font-family="Arial, sans-serif" font-size="4.5" fill="#8B949E">4MB FLASH</text>
  <!-- EN button -->
  <rect x="22" y="152" width="18" height="11" rx="2" fill="#EFF6FF" stroke="#B8C2CC"/>
  <text x="31" y="160" text-anchor="middle" font-family="Arial, sans-serif" font-size="4" fill="#334155">EN</text>
  <!-- BOOT button -->
  <rect x="80" y="152" width="18" height="11" rx="2" fill="#EFF6FF" stroke="#B8C2CC"/>
  <text x="89" y="160" text-anchor="middle" font-family="Arial, sans-serif" font-size="3.8" fill="#334155">BOOT</text>
  <!-- LED -->
  <circle cx="28" cy="55" r="4" fill="#1976D2" stroke="#0D47A1"/>
  <text x="28" y="66" text-anchor="middle" font-family="Arial, sans-serif" font-size="4" fill="#90CAF9">LED</text>
  <!-- Label -->
  <text x="60" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" font-weight="700" fill="#FFFFFF">ESP32</text>
  <text x="60" y="197" text-anchor="middle" font-family="Arial, sans-serif" font-size="6" fill="#4FC3F7">DevKit V1</text>
  <!-- Left pin labels -->
  <g fill="#DDE7EF" font-family="Arial, sans-serif" font-size="4.8">
    <text x="24" y="21" fill="#FACC15">3V3</text>
    <text x="24" y="34">EN</text>
    <text x="24" y="47">VP</text>
    <text x="24" y="60">VN</text>
    <text x="24" y="73">G34</text>
    <text x="24" y="86">G35</text>
    <text x="24" y="99">G32</text>
    <text x="24" y="112">G33</text>
    <text x="24" y="125">G25</text>
    <text x="24" y="138">G26</text>
    <text x="24" y="151">G27</text>
    <text x="24" y="164">G14</text>
    <text x="24" y="177">G12</text>
    <text x="24" y="190">G13</text>
    <text x="24" y="203" fill="#8BA3B4">GND</text>
  </g>
  <!-- Right pin labels -->
  <g fill="#DDE7EF" font-family="Arial, sans-serif" font-size="4.8">
    <text x="96" y="21" text-anchor="end" fill="#FCA5A5">VIN</text>
    <text x="96" y="34" text-anchor="end" fill="#8BA3B4">GND</text>
    <text x="96" y="47" text-anchor="end">G23</text>
    <text x="96" y="60" text-anchor="end">G22</text>
    <text x="96" y="73" text-anchor="end">TX0</text>
    <text x="96" y="86" text-anchor="end">RX0</text>
    <text x="96" y="99" text-anchor="end">G21</text>
    <text x="96" y="112" text-anchor="end" fill="#8BA3B4">GND</text>
    <text x="96" y="125" text-anchor="end">G19</text>
    <text x="96" y="138" text-anchor="end">G18</text>
    <text x="96" y="151" text-anchor="end">G5</text>
    <text x="96" y="164" text-anchor="end">G17</text>
    <text x="96" y="177" text-anchor="end">G16</text>
    <text x="96" y="190" text-anchor="end">G4</text>
    <text x="96" y="203" text-anchor="end">G2</text>
    <text x="96" y="216" text-anchor="end">G0</text>
  </g>
  <!-- Left pin holes -->
  <g fill="#1F2933" stroke="#9CA3AF" stroke-width=".7">
    <circle cx="13" cy="18" r="2.2"/><circle cx="13" cy="31" r="2.2"/><circle cx="13" cy="44" r="2.2"/>
    <circle cx="13" cy="57" r="2.2"/><circle cx="13" cy="70" r="2.2"/><circle cx="13" cy="83" r="2.2"/>
    <circle cx="13" cy="96" r="2.2"/><circle cx="13" cy="109" r="2.2"/><circle cx="13" cy="122" r="2.2"/>
    <circle cx="13" cy="135" r="2.2"/><circle cx="13" cy="148" r="2.2"/><circle cx="13" cy="161" r="2.2"/>
    <circle cx="13" cy="174" r="2.2"/><circle cx="13" cy="187" r="2.2"/><circle cx="13" cy="200" r="2.2"/>
  </g>
  <!-- Right pin holes -->
  <g fill="#1F2933" stroke="#9CA3AF" stroke-width=".7">
    <circle cx="107" cy="18" r="2.2"/><circle cx="107" cy="31" r="2.2"/><circle cx="107" cy="44" r="2.2"/>
    <circle cx="107" cy="57" r="2.2"/><circle cx="107" cy="70" r="2.2"/><circle cx="107" cy="83" r="2.2"/>
    <circle cx="107" cy="96" r="2.2"/><circle cx="107" cy="109" r="2.2"/><circle cx="107" cy="122" r="2.2"/>
    <circle cx="107" cy="135" r="2.2"/><circle cx="107" cy="148" r="2.2"/><circle cx="107" cy="161" r="2.2"/>
    <circle cx="107" cy="174" r="2.2"/><circle cx="107" cy="187" r="2.2"/><circle cx="107" cy="200" r="2.2"/>
    <circle cx="107" cy="213" r="2.2"/>
  </g>
  <!-- WiFi antenna symbol -->
  <path d="M 48 35 Q 52 30 56 35" stroke="#4FC3F7" stroke-width="1.5" fill="none"/>
  <path d="M 45 38 Q 52 28 59 38" stroke="#4FC3F7" stroke-width="1.2" fill="none" opacity="0.7"/>
  <path d="M 42 41 Q 52 26 62 41" stroke="#4FC3F7" stroke-width="1" fill="none" opacity="0.4"/>
  <circle cx="52" cy="36" r="1.5" fill="#4FC3F7"/>
</svg>
