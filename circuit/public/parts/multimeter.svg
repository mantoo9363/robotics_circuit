<desc style="fill:rgb(0, 0, 0);stroke:none;color:rgb(11, 11, 11);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">Illustration of a VDC voltmeter with a blank display. The minus label sits to the left of the black terminal and the plus label sits to the right of the red terminal, both fully flush against the display with no orange gap visible around them, leads passing continuously through the gray stand bar down to their pointed tips.</desc>
