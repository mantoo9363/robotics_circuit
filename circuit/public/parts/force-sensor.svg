<desc style="fill:rgb(0, 0, 0);stroke:none;color:rgb(11, 11, 11);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">Illustration of a force sensitive resistor: a dark circular sensing pad with horizontal grid lines correctly clipped to stay inside the circle boundary, a faint dashed vertical center line, connected to a long teal flat flexible tail with two vertical stripes, ending in a light gray connector block and two straight gray pin legs.</desc>
